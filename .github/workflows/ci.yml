# CI: lints (ruff) and tests (pytest, with coverage) every push to
# develop/master and every pull request. A second job publishes a JUnit
# test report and a coverage summary (plus diff/patch coverage on PRs) as
# a sticky PR comment. This doesn't block merging on failure - GitHub's
# required-status-checks branch protection needs GitHub Pro on a private
# repo - so treat a red check here as "don't merge" by convention.
name: CI
run-name: >
  Build & Test (CI) #${{ github.run_number }}:
  ${{ github.event_name == 'push' && github.event.head_commit.message
      || github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || github.event_name == 'workflow_dispatch' && format('manual on {0}', github.ref_name)
      || '' }}

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # PyGObject/AppIndicator/Cairo bindings come from apt, not PyPI - see
      # README.md's "Installing on Ubuntu" section. The venv below is
      # created with --system-site-packages so it can see these.
      - name: Install system GTK/AppIndicator/Cairo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1

      - name: Create virtual environment
        run: python3 -m venv --system-site-packages .venv

      - name: Install project and dev dependencies
        run: |
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest --cov=glucoglance --cov-report=xml:coverage.xml --cov-report=term --junitxml=junit.xml

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: junit.xml
          if-no-files-found: warn

      - name: Upload coverage report (Cobertura XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-artifacts
          path: coverage.xml
          if-no-files-found: warn

  report:
    name: Publish test & coverage report
    runs-on: ubuntu-latest
    needs: build
    permissions: write-all
    if: always()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test results (JUnit)
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: ./artifacts/test-results

      - name: Generate test report
        uses: dorny/test-reporter@v1
        with:
          name: Pytest Tests
          path: ./artifacts/test-results/junit.xml
          reporter: java-junit

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-artifacts
          path: ./artifacts/coverage

      # Coverage is informational, not a merge gate: this project
      # intentionally leaves GTK/keyring-dependent code (main.py, ui/tray.py,
      # ui/credential_prompt.py, ui/display.py, config/credentials.py)
      # untested - see CLAUDE.md's "Testing philosophy" section - so overall
      # coverage sits around 50% by design, not by accident.
      - name: Post coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./artifacts/coverage/coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          thresholds: '50 75'
          output: both
          indicators: 'true'

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Compute diff coverage (changed lines only)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin $BASE_REF --depth=1
          diff-cover ./artifacts/coverage/coverage.xml \
            --compare-branch origin/$BASE_REF \
            --markdown-report diff_coverage.md \
            --html-report diff_coverage.html

      - name: Ensure diff coverage markdown exists (non-PR safe)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "## Diff (Patch) Coverage" > diff_coverage.md
          echo "_Not a pull request build; patch coverage is only computed for PRs._" >> diff_coverage.md

      - name: Upload diff coverage HTML (optional)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage-html
          path: diff_coverage.html

      - name: Build combined coverage comment (overall + patch)
        run: |
          {
            echo "# Test Coverage Summary";
            echo;
            echo "### Overall Coverage";
            echo;
            cat code-coverage-results.md;
            echo;
            cat diff_coverage.md;
          } > combined_coverage.md

      - name: Post single sticky PR coverage comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: combined_coverage.md
