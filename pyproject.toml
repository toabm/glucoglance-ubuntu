[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glucoglance"
version = "0.3.1"
description = "Ubuntu-only tray widget showing live FreeStyle Libre glucose readings (requires a LibreLinkUp account)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Angel Blanco", email = "toabm@yahoo.es" }]
keywords = ["glucose", "freestyle-libre", "librelinkup", "cgm", "tray", "gnome", "ubuntu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31",
    "keyring>=24",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/toabm/glucoglance-ubuntu"
Issues = "https://github.com/toabm/glucoglance-ubuntu/issues"

[project.scripts]
glucoglance = "glucoglance.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
]
# IDE-only type stubs for gi.repository (GLib/Gtk/etc.) - kept separate from
# `dev` because pip can't tell the real PyGObject/pycairo are already
# provided by apt (see README's "Installing on Ubuntu"), and tries to build
# them from source to satisfy this package's declared dependency, which
# fails without cairo/girepository dev headers. Not needed to lint or test,
# so CI installs only `dev`. Install with: pip install --no-deps PyGObject-stubs
ide = [
    "PyGObject-stubs>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glucoglance = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",  # PyGObject requires gi.require_version() calls before the gi.repository imports they gate
    "DTZ",   # timestamps here are intentionally naive local time - see client/librelinkup.py's docstring
]

[tool.coverage.run]
source = ["glucoglance"]
branch = true
