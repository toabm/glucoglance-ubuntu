[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucose-widget"
version = "0.1.0"
description = "Ubuntu tray widget showing live glucose readings from a FreeStyle Libre sensor via LibreLinkUp"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "keyring>=24",
    "tomli-w>=1.0",
]

[project.scripts]
glucose-widget = "glucose_widget.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "PyGObject-stubs>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glucose_widget = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
