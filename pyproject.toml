[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucoglance"
version = "0.1.1"
description = "Ubuntu tray widget showing live glucose readings from a FreeStyle Libre sensor via LibreLinkUp"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "keyring>=24",
    "tomli-w>=1.0",
]

[project.scripts]
glucoglance = "glucoglance.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
]
# IDE-only type stubs for gi.repository (GLib/Gtk/etc.) - kept separate from
# `dev` because pip can't tell the real PyGObject/pycairo are already
# provided by apt (see README's "Installing on Ubuntu"), and tries to build
# them from source to satisfy this package's declared dependency, which
# fails without cairo/girepository dev headers. Not needed to lint or test,
# so CI installs only `dev`. Install with: pip install --no-deps PyGObject-stubs
ide = [
    "PyGObject-stubs>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glucoglance = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",  # PyGObject requires gi.require_version() calls before the gi.repository imports they gate
    "DTZ",   # timestamps here are intentionally naive local time - see client/librelinkup.py's docstring
]

[tool.coverage.run]
source = ["glucoglance"]
branch = true
